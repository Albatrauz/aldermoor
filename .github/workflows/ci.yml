# Typecheck and build every PR and every push to main. `vite build` does not
# typecheck, so without this a TypeScript error would reach Coolify unnoticed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# a newer push to the same branch cancels the run still going for the old one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # same Node major as the Dockerfile (Vite 8 needs >=20.19 / >=22.12)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
